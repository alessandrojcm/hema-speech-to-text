# Pipeline Mode Configuration Example

# OBS Configuration (can be empty for pipeline-only mode)
obs:
  host: "localhost"
  port: 4455
  password: ""

# Audio Configuration for Pipeline
audio:
  device:
    sample_rate: 16000
    channels: 1
    bit_depth: 16
    frames_per_buffer: 1024
  buffer:
    duration: "60s"
    segment_size: "1s"
  processing:
    vad_type: "webrtc"
    enable_preprocessing: true
    normalization: true
  extraction:
    default_duration: "5s"
    max_concurrent: 2
  capture:
    # Async processing configuration (always enabled)
    async_processing:
      channel_buffer_size: 20
      max_processing_lag_ms: 500
      drop_threshold: 10
      monitoring_interval_ms: 1000

# Speech Recognition Configuration
speech:
  whisper:
    model_path: "./models/ggml-base.bin"
    model_size: "base"
    language: "en"
    thread_count: 2
    suppress_blank: true
    suppress_non_speech: true
    suppress_regex: "\\[.*\\]|\\(.*\\)|um|uh|ah|eh"  # Filter out brackets, parentheses, filler words
    no_speech_threshold: 0.6   # Higher = more aggressive filtering
    logprob_threshold: -1.0     # Token log probability threshold
    min_token_confidence: 0.3   # Minimum confidence for tokens
      initial_prompt: ""  # Initial prompt for whisper (can be used for vocabulary hints)

  processing:
    target_sample_rate: 16000
    segment_duration: "10s"
    normalization: true
    vad_enabled: true
    
    # Quality filtering parameters
    quality_enabled: true
    min_energy: 0.01        # Minimum RMS energy
    min_snr: 3.0            # Minimum signal-to-noise ratio in dB
    min_voice_ratio: 0.2    # Minimum ratio of voiced frames
  performance:
    max_concurrent: 2
    cache_size: 10
    cache_ttl: "1m"
    timeout_duration: "10s"

# Pipeline System Configuration
pipeline:
  # Audio settings for pipeline (override main audio)
  audio:
    device:
      sample_rate: 16000
      channels: 1
      bit_depth: 16
    buffer:
      duration: "60s"
      segment_size: "1s"
    processing:
      vad_type: "webrtc"
    extraction:
      default_duration: "5s"
      max_concurrent: 2

  # Speech settings for pipeline (override main speech)
  speech:
    whisper:
      model_size: "base"
      language: "en"
      thread_count: 2
      suppress_blank: true
      suppress_non_speech: true
      suppress_regex: "\\[.*\\]|\\(.*\\)|um|uh|ah|eh"  # Filter out brackets, parentheses, filler words
      no_speech_threshold: 0.6
      logprob_threshold: -1.0     # Token log probability threshold
      min_token_confidence: 0.3   # Minimum confidence for tokens
    initial_prompt: ""  # Initial prompt for whisper (can be used for vocabulary hints)
    performance:
      max_concurrent: 2
      cache_size: 10
      timeout_duration: "10s"

  # VAD Configuration
  vad:
    min_speech_duration_ms: 500   # Increase from 250ms to reduce false triggers
    max_silence_duration_ms: 1000 # Allow longer pauses in speech
    vad_mode: 2                    # More aggressive mode (0-3, higher = more aggressive)
    buffer_before_ms: 200          # Capture context before speech
    buffer_after_ms: 300           # Capture context after speech
    
    # New parameters for better filtering
    energy_threshold: 0.02         # Minimum energy to consider as speech
    zero_crossing_threshold: 0.3   # Maximum ZCR for speech (vs music/noise)
    spectral_flatness_threshold: 0.5  # Differentiate speech from white noise

  # Pipeline Processing Settings
  pipeline:
    max_concurrent_requests: 3
    processing_timeout: "30s"
    segment_buffer_size: 50
    max_retries: 3
    retry_delay: "1s"
    fallback_enabled: true
    metrics_enabled: true
    metrics_interval: "10s"

# LLM Configuration (optional for pipeline mode)
openaiendpoint: "http://localhost:8000"

# Logging
logging:
  level: "info"
  format: "json"