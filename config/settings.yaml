obs:
  host: "localhost"
  port: 4455
  password: ""

replay:
  buffer_duration: "60s"
  pre_roll_seconds: 5
  min_interval: "15s"
  queue_size: 10

text:
  source_name: "ReplayText"
  default_messages:
    - "Point scored!"
    - "Excellent exchange!"
    - "Match continues..."
  max_length: 100

scene:
  main_scene: "Main"
  replay_scene: "Replay"

audio:
  device:
    name: "Razer Barracuda X" # Target audio device
    id: 1 # Use built-in microphone
    sample_rate: 16000 # Sample rate in Hz (16kHz optimal for speech processing and WebRTC VAD)
    channels: 1 # Number of channels (mono for built-in mic)
    bit_depth: 16 # Bit depth
    frames_per_buffer: 1024 # Buffer size in frames
    fallback_devices: # Fallback device names
      - "Built-in Microphone"
      - "Default"
    monitor_interval: "5s" # Device health check interval

  buffer:
    duration: "60s" # Total buffer duration
    segment_size: "1s" # Individual segment size
    overwrite_policy: "circular" # Overwrite policy
    preallocate_size: 0 # Memory preallocation (0 = auto)

  processing:
    enable_preprocessing: true # Enable audio preprocessing
    normalization: false # Enable normalization
    highpass_filter: 80.0 # High-pass filter frequency (Hz)
    lowpass_filter: 8000.0 # Low-pass filter frequency (Hz)
    vad_threshold: 0.001 # Voice activity detection threshold (lowered for better sensitivity)
    # Library selection
    resampler_type: "gosamplerate"
    vad_type: "webrtc"
    wav_exporter_type: "goaudio"
    fft_type: "gonum"
    # Library-specific settings
    resampler_quality: 0 # Best quality
    vad_mode: 1 # Less aggressive (changed from 3)

  extraction:
    default_duration: "10s" # Default extraction duration
    max_concurrent: 5 # Maximum concurrent extractions
    output_format: "wav" # Output format (wav, raw)
    output_sample_rate: 16000 # Output sample rate (for whisper)
    output_channels: 1 # Output channels (mono for whisper)
    timestamp_precision: "10ms" # Timestamp precision

speech:
  whisper:
    model_path: "./models/ggml-medium.bin"
    model_size: "base"
    language: "en"
    use_gpu: true
    thread_count: 4
    max_tokens: 448
    temperature: 0.0
    beam_size: 5
    word_timestamps: true



  processing:
    target_sample_rate: 16000
    segment_duration: "10s"
    overlap_duration: "1s"
    noise_reduction: true
    normalization: true
    vad_enabled: true

  performance:
    max_concurrent: 3
    cache_size: 1000
    cache_ttl: "5m"
    timeout_duration: "30s"
    memory_limit: 1073741824 # 1GB
    metal_optimization: true

llm:
  endpoint: "http://localhost:8080"
  model_id: "mlx-community/Qwen3-4B-Instruct-2507-8bit"
  timeout: "30s"

commentary:
  default_template: "point_scored"
  max_latency: "20s"
  default_quality: "balanced"
  concurrent_requests: 3
  min_confidence: 0.6
  quality_threshold: 0.2  # Lowered from default 0.3
  relevance_threshold: 0.15  # Lowered from default 0.25
  enable_fallback: true
  fallback_threshold: 0.6
  max_retries: 2
  max_output_length: 200
  min_output_length: 10
  enable_profanity_filter: true
  enable_cache: true
  default_cache_policy: "default"
  enable_metrics: true
  enable_logging: true
  log_level: "info"

pipeline:
  speech:
    whisper:
      model_size: "base"
      language: "en"
      thread_count: 2
    performance:
      max_concurrent: 2
      cache_size: 10
      timeout_duration: "10s"
  vad:
    min_speech_duration_ms: 500
    max_silence_duration_ms: 1000
    vad_mode: 2
    buffer_before_ms: 100
    buffer_after_ms: 200
  pipeline:
    max_concurrent_requests: 3
    processing_timeout: "30s"
    segment_buffer_size: 50
    max_retries: 3
    retry_delay: "1s"
    fallback_enabled: true
    metrics_enabled: true
    metrics_interval: "10s"

logging:
  level: "debug"
  format: "json"
