obs:
  host: "localhost"
  port: 4455
  password: ""

replay:
  buffer_duration: "60s"
  pre_roll_seconds: 5
  min_interval: "15s"
  queue_size: 10

text:
  source_name: "ReplayText"
  default_messages:
    - "Point scored!"
    - "Excellent exchange!"
    - "Match continues..."
  max_length: 100

scene:
  main_scene: "Main"
  replay_scene: "Replay"

audio:
  device:
    name: "MacBook Pro Microphone" # Target audio device
    id: 1 # Use built-in microphone
    sample_rate: 44100 # Sample rate in Hz (match built-in mic)
    channels: 1 # Number of channels (mono for built-in mic)
    bit_depth: 16 # Bit depth
    frames_per_buffer: 1024 # Buffer size in frames
    fallback_devices: # Fallback device names
      - "Built-in Microphone"
      - "Default"
    monitor_interval: "5s" # Device health check interval

  buffer:
    duration: "60s" # Total buffer duration
    segment_size: "1s" # Individual segment size
    overwrite_policy: "circular" # Overwrite policy
    preallocate_size: 0 # Memory preallocation (0 = auto)

  processing:
    enable_preprocessing: true # Enable audio preprocessing
    normalization: true # Enable normalization
    highpass_filter: 80.0 # High-pass filter frequency (Hz)
    lowpass_filter: 8000.0 # Low-pass filter frequency (Hz)
    vad_threshold: 0.1 # Voice activity detection threshold

  extraction:
    default_duration: "10s" # Default extraction duration
    max_concurrent: 5 # Maximum concurrent extractions
    output_format: "wav" # Output format (wav, raw)
    output_sample_rate: 16000 # Output sample rate (for whisper)
    output_channels: 1 # Output channels (mono for whisper)
    timestamp_precision: "10ms" # Timestamp precision

speech:
  whisper:
    model_path: "./models/ggml-base.bin"
    model_size: "base"
    language: "en"
    use_gpu: true
    thread_count: 4
    max_tokens: 448
    temperature: 0.0
    beam_size: 5
    word_timestamps: true

  vocabulary:
    hema_vocab_path: "./config/hema_vocabulary.txt"
    boost_weights:
      "longsword": 2.0
      "riposte": 1.8
      "bind": 1.5
      "halt": 2.5
      "point": 2.0
    context_switching: true
    validation_rules:
      - "validate_hema_terms"
      - "check_phonetic_similarity"
    custom_terms:
      - "nachreisen"
      - "zwerchhau"
      - "zornhau"

  processing:
    target_sample_rate: 16000
    segment_duration: "10s"
    overlap_duration: "1s"
    noise_reduction: true
    normalization: true
    vad_enabled: true

  performance:
    max_concurrent: 3
    cache_size: 1000
    cache_ttl: "5m"
    timeout_duration: "30s"
    memory_limit: 1073741824 # 1GB
    metal_optimization: true

logging:
  level: "debug"
  format: "json"
